<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atlas 3D de Arquitectura de Software</title>

    <!-- PWA: el manifest se sirve desde public/, por eso la ruta es la raíz -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0b1220" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/iconos/icon-192.png" />
  </head>
  <body>
    <div class="app">
      <aside class="panel-lateral">
        <header class="marca">
          <h1>Atlas 3D</h1>
          <p>Arquitectura de Software</p>
        </header>

        <h2 class="titulo-catalogo">Explorar modelos</h2>
        <button id="filtro-favoritos" class="filtro-favoritos" type="button" aria-pressed="false">Ver favoritos</button>
        <p id="estado-catalogo" class="mensaje-catalogo" role="status" aria-live="polite"></p>
        <nav id="lista-catalogo" class="lista-catalogo" aria-label="Catálogo de patrones"></nav>
      </aside>

      <main class="visor">
        <div class="lienzo-caja">
          <canvas id="lienzo-3d"></canvas>
          <p id="estado-visor" class="estado-visor" role="status" aria-live="polite" hidden></p>
          <p class="pista">Arrastra para girar el modelo</p>
        </div>

        <div class="detalle-modelo">
          <section id="descripcion-patron" class="descripcion"></section>
          <section id="panel-notas" class="notas" aria-label="Notas privadas">
            <h3 id="titulo-nota">Nota privada</h3>
            <p id="estado-nota" role="status" aria-live="polite"></p>
            <label for="password-nota">Contraseña de la nota</label>
            <input id="password-nota" type="password" autocomplete="off" />
            <label for="texto-nota">Texto privado</label>
            <textarea id="texto-nota" rows="4" hidden></textarea>
            <div class="acciones-nota">
              <button id="desbloquear-nota" type="button" hidden>Desbloquear</button>
              <button id="guardar-nota" type="button" hidden>Guardar cifrada</button>
              <button id="cerrar-nota" type="button">Cerrar nota</button>
            </div>
          </section>
        </div>
      </main>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
